@let isHandset = this.isHandset();

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="isHandset === false"
  >
    <!-- Logo de la marca -->
    <a class="marca menu-marca" routerLink="/Clientes">
      <img ngSrc="lulosa-isologo.svg" width="37" height="40" alt="" />
      <span class="marca-nombre">LULOSA</span>
    </a>

    <p class="menu-seccion">Administración</p>

    <!-- routerLinkActive agrega la clase "activo" al enlace de la página abierta -->
    <nav class="menu-enlaces">
      <a routerLink="/Clientes" routerLinkActive="activo" (click)="isHandset && drawer.close()">
        <mat-icon aria-hidden="true">group</mat-icon> Clientes
      </a>
      <a routerLink="/Inventario" routerLinkActive="activo" (click)="isHandset && drawer.close()">
        <mat-icon aria-hidden="true">inventory_2</mat-icon> Inventario
      </a>
      <a routerLink="/form" routerLinkActive="activo" (click)="isHandset && drawer.close()">
        <mat-icon aria-hidden="true">add_circle_outline</mat-icon> Agregar producto
      </a>
      <a routerLink="/Compras" routerLinkActive="activo" (click)="isHandset && drawer.close()">
        <mat-icon aria-hidden="true">shopping_bag</mat-icon> Compras
      </a>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="contenido">
    <header class="barra-superior">
      @if (isHandset) {
        <button type="button" aria-label="Abrir menú" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
        <span class="marca-nombre barra-marca">LULOSA</span>
      }
      <button type="button" class="boton-salir" (click)="cerrarSesion()">
        <mat-icon aria-hidden="true">logout</mat-icon> Cerrar sesión
      </button>
    </header>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
